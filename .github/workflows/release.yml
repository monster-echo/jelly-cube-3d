name: release-artifacts

# Builds signed artifacts on workflow_dispatch/tags and publishes a GitHub
# Release for v* tags. Uploaded stores: Android AAB lands in the Play
# production track as a DRAFT (never auto-published), and iOS IPA lands in
# TestFlight. Human review and the final release buttons stay manual.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, android, ios, harmony]
        default: android
      allow_unsigned:
        description: Build unsigned artifacts for CI validation (not releasable)
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: .

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "${GITHUB_REF_NAME}" != "v$VERSION" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pubspec version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pubspec version: $VERSION"

  android:
    needs: version
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Restore release.env
        run: |
          echo "${{ secrets.RELEASE_ENV }}" > release.env
      - name: Restore Android upload keystore
        if: ${{ !inputs.allow_unsigned }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/jelly-upload.jks
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=jelly-upload.jks
          PROPS
      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          ./tool/test.sh
      - name: Compute version and build number
        run: |
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          BUILD="$(date -u +%y%j%H%M)"
          echo "RELEASE_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "version $VERSION build $BUILD"
      - name: Build AAB
        run: |
          if [ "${{ inputs.allow_unsigned }}" = "true" ]; then
            flutter build appbundle --release
          else
            ./scripts/build-release.sh android
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/release/**/*.aab
            build/release/**/*.sha256
          if-no-files-found: error
      - name: Upload AAB to Google Play (production draft)
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "Play service account not configured; skipping Play upload."
            exit 0
          fi
          AAB="$(find build/release -name '*.aab' -print -quit)"
          test -n "$AAB"
          python3 - "$AAB" <<'PY'
          import json, os, sys, time, urllib.request
          key = json.loads(os.environ['GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'])
          aab_path = sys.argv[1]
          package = 'tech.zhongbei.jellycube3d'
          api = 'https://androidpublisher.googleapis.com/androidpublisher/v3/applications/' + package
          upload = 'https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/' + package

          import jwt
          now = int(time.time())
          assertion = jwt.encode({'iss': key['client_email'],
              'scope': 'https://www.googleapis.com/auth/androidpublisher',
              'aud': key['token_uri'], 'iat': now, 'exp': now + 3600},
              key['private_key'], algorithm='RS256')
          body = ('grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion='
                  + assertion).encode()
          token = json.load(urllib.request.urlopen(urllib.request.Request(
              key['token_uri'], data=body,
              headers={'Content-Type': 'application/x-www-form-urlencoded'})))['access_token']
          auth = {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}

          def call(method, path, data=None, ctype='application/json'):
              payload = json.dumps(data).encode() if isinstance(data, (dict, list)) else (data or b'')
              r = urllib.request.Request(api + path, data=payload, method=method,
                  headers=dict(auth, **{'Content-Type': ctype}))
              with urllib.request.urlopen(r, timeout=300) as resp:
                  raw = resp.read()
                  return json.loads(raw) if raw else {}

          edit = call('POST', '/edits')['id']
          print('edit', edit)
          aab = open(aab_path, 'rb').read()
          r = urllib.request.Request(f'{upload}/edits/{edit}/bundles?uploadType=media',
              data=aab, method='POST',
              headers=dict(auth, **{'Content-Type': 'application/octet-stream'}))
          with urllib.request.urlopen(r, timeout=600) as resp:
              bundle = json.load(resp)
          vc = bundle['versionCode']
          print('AAB versionCode', vc)
          def load_notes():
              import pathlib
              version = os.environ.get('RELEASE_NAME', '')
              base = pathlib.Path('store/google/release-notes') / version
              if not base.is_dir():
                  raise SystemExit(
                      f'Missing what-is-new notes: {base}/ with at least en-US.txt. '
                      'Every release tag must ship user-facing notes.')
              notes = []
              for f in sorted(base.glob('*.txt')):
                  text = f.read_text().strip()[:500]
                  if text:
                      notes.append({'language': f.stem, 'text': text})
              if not any(n['language'] == 'en-US' for n in notes):
                  raise SystemExit('en-US.txt what-is-new notes are mandatory.')
              return notes
          notes = load_notes()
          internal_release = {'name': f'{os.environ.get("RELEASE_NAME", "")} ({vc}) 内部测试',
                   'versionCodes': [vc], 'status': 'completed', 'releaseNotes': notes}
          prod_release = {'name': f'{os.environ.get("RELEASE_NAME", "")} ({vc})',
                   'versionCodes': [vc], 'status': 'draft', 'releaseNotes': notes}
          call('PUT', f'/edits/{edit}/tracks/internal',
              {'track': 'internal', 'releases': [internal_release]})
          call('PUT', f'/edits/{edit}/tracks/production',
              {'track': 'production', 'releases': [prod_release]})
          call('POST', f'/edits/{edit}:commit')
          check = call('POST', '/edits')['id']
          for track in ('internal', 'production'):
              tr = call('GET', f'/edits/{check}/tracks/{track}')
              codes = [c for r in tr.get('releases', [])
                       for c in r.get('versionCodes', [])]
              if str(vc) not in codes:
                  raise SystemExit(f'committed bundle missing from {track} track')
          print('Play upload verified on internal+production for versionCode', vc)
          PY

  ios:
    needs: version
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Restore release.env
        run: echo "${{ secrets.RELEASE_ENV }}" > release.env
      - name: Import Apple distribution signing
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          echo "$CERT_P12_BASE64" | base64 -d > /tmp/distribution.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/distribution.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          echo "$PROFILE_BASE64" | base64 -d > /tmp/jelly.mobileprovision
          UUID="$(security cms -D -i /tmp/jelly.mobileprovision | plutil -extract UUID raw -)"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp /tmp/jelly.mobileprovision "$dir/$UUID.mobileprovision"
            cp /tmp/jelly.mobileprovision "$dir/jelly.mobileprovision"
          done
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          profile_name = os.environ['PROFILE_NAME']
          identity = os.environ['SIGNING_IDENTITY']
          options = {
              'method': 'app-store-connect',
              'teamID': '2VA9TC6SG4',
              'signingStyle': 'manual',
              'signingCertificate': identity,
              'provisioningProfiles': {'tech.zhongbei.jellycube3d': profile_name},
              'uploadSymbols': True,
          }
          out = Path(os.environ['RUNNER_TEMP']) / 'ExportOptions.plist'
          out.write_bytes(plistlib.dumps(options))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'APPLE_EXPORT_OPTIONS_PLIST={out}\n')
          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          text = project.read_text()
          start = text.index('97C147071CF9000F007C117D /* Release */ = {')
          end = text.index('name = Release;', start)
          settings = ('buildSettings = {\nCODE_SIGN_STYLE = Manual;\nCODE_SIGN_IDENTITY = "' +
                      identity + '";\nPROVISIONING_PROFILE_SPECIFIER = "' + profile_name + '";')
          project.write_text(text[:start] + text[start:end].replace('buildSettings = {', settings) + text[end:])
          PY
      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          ./tool/test.sh
      - name: Compute version and build number
        run: |
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          BUILD="$(date -u +%y%j%H%M)"
          echo "RELEASE_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "version $VERSION build $BUILD"
      - name: Build IPA
        run: ./scripts/build-release.sh ios
      - name: Upload to TestFlight
        continue-on-error: true
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPSTORE_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [[ -z "$APPSTORE_KEY_ID" || -z "$APPSTORE_ISSUER" || -z "$APPSTORE_PRIVATE_KEY" ]]; then
            echo "App Store Connect API key not configured; skipping TestFlight upload."
            exit 0
          fi
          IPA="$(find build/release -name '*.ipa' -print -quit)"
          test -n "$IPA"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$APPSTORE_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$APPSTORE_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER" --output-format json
      - name: Attach What's New to App Store version
        continue-on-error: true   # versions resubmitted after rejection lock whatsNew via API
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPSTORE_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          python3 -m pip install --quiet 'PyJWT[crypto]'
          python3 scripts/asc_set_whatsnew.py --version "$RELEASE_NAME"
      - name: Verify Apple processing
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPSTORE_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          python3 scripts/asc_verify_build.py --build "$RELEASE_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: |
            build/release/**/*.ipa
            build/release/**/*.sha256
          if-no-files-found: error

  harmony:
    if: ${{ vars.ENABLE_HARMONY == 'true' && (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'harmony') }}
    continue-on-error: true
    # DevEco Studio, the OpenHarmony SDK, and the Flutter-OHOS fork are not
    # present on GitHub-hosted runners. Use a trusted, access-controlled
    # self-hosted macOS runner with those tools installed.
    runs-on: [self-hosted, macOS, harmony]
    steps:
      - uses: actions/checkout@v4
      - name: Restore release.env
        run: echo "${{ secrets.RELEASE_ENV }}" > release.env
      - name: Configure Harmony environment
        run: |
          echo "DEVECO_SDK_HOME=${{ secrets.HARMONY_DEVECO_SDK_HOME }}" >> "$GITHUB_ENV"
          echo "FLUTTER_OHOS=${{ secrets.FLUTTER_OHOS }}" >> "$GITHUB_ENV"
      - name: Analyze and test
        run: |
          "$FLUTTER_OHOS" pub get
          "$FLUTTER_OHOS" analyze
          "$FLUTTER_OHOS" test
      - name: Build HAP
        run: ./scripts/build-release.sh harmony
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-release
          path: |
            build/release/**/*.hap
            build/release/**/*.sha256
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: [android, ios, harmony]
    if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success' && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist/android
      - uses: actions/download-artifact@v4
        with:
          name: ios-release
          path: dist/ios
      - uses: actions/download-artifact@v4
        with:
          name: harmony-release
          path: dist/harmony
        continue-on-error: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          for ext in aab ipa; do
            find dist -type f -name "*.$ext" -print -quit | grep -q . || {
              echo "Missing .$ext artifact" >&2
              exit 1
            }
          done
          FILES=()
          while IFS= read -r file; do
            FILES+=("$file")
          done < <(find dist -type f \( -name '*.aab' -o -name '*.ipa' -o -name '*.hap' -o -name '*.sha256' \) -print)
          gh release create "$TAG" \
            --title "Jelly Cube 3D $TAG" \
            --notes-file .github/RELEASE_BODY.md \
            "${FILES[@]}"
