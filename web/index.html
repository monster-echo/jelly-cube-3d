<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Jelly Cube 3D</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <canvas id="gl-canvas"></canvas>

    <!-- Minimal Top HUD -->
    <header id="hud-top" class="hud-top hidden">
      <div class="left-group">
        <button class="pill-btn level-pill" data-nav="levels">
          <span id="hud-title">Level 1</span>
          <span class="caret">▾</span>
        </button>
      </div>

      <div class="moves-pill">
        <span id="hud-sub">0/1 · 00:00.0</span>
      </div>

      <div class="right-group">
        <button class="pill-btn coins-pill" data-nav="skins" title="Jelly Collection">
          🍬 <span id="hud-coins">40</span>
        </button>
        <button class="icon-btn" id="btn-menu" title="Pause">⏸</button>
      </div>
    </header>

    <div id="toast" class="toast"></div>

    <!-- Minimal Bottom Dock -->
    <footer id="hud-bottom" class="hud-bottom hidden">
      <button class="act-btn" id="btn-undo">↩ Undo</button>
      <button class="act-btn hint" id="btn-hint">💡 Hint</button>
      <button class="act-btn ad-solve" id="btn-auto-solve">🎬 Tutorial</button>
    </footer>

    <!-- Home Screen (Live 3D Jelly Cube rotates in background) -->
    <section id="home-screen" class="home-screen">
      <div class="home-top">
        <div class="home-badge">JELLY CUBE 3D</div>
        <div class="pill-btn coins-pill" data-nav="skins">🍬 <span id="home-coins">120</span></div>
      </div>

      <div class="home-hero-spacer">
        <h1 class="home-logo">Jelly Cube 3D</h1>
        <p class="home-tagline">Squishy Physics · Endgame Puzzles · Global Ranks</p>
      </div>

      <div class="home-actions">
        <button class="home-cta" id="home-play">▶ Play Level <span id="home-lvl">1</span></button>
        <div class="home-grid-2">
          <button class="home-card-btn" id="home-daily">📅 Daily (<span id="home-streak">0</span>d streak)</button>
          <button class="home-card-btn" id="home-challenge">🏆 Global Ranks</button>
        </div>
        <div class="home-grid-4">
          <button class="home-mini-btn" id="home-skins">🍮 Skins</button>
          <button class="home-mini-btn" id="home-share">📤 Share +15🍬</button>
          <button class="home-mini-btn" id="home-rate">⭐ Rate</button>
          <button class="home-mini-btn gold" id="home-ad-coins">🎬 +30 🍬</button>
        </div>
        <div class="legal-links">
          <button class="legal-btn" id="btn-privacy">Privacy Policy</button>
          <span>·</span>
          <button class="legal-btn" id="btn-terms">Terms of Use</button>
        </div>
      </div>
    </section>

    <div id="modal-backdrop" class="modal-backdrop hidden">
      <div id="modal-card" class="modal-card"></div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
